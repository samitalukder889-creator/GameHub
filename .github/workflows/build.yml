name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project
      run: cordova create mygame com.project.gamehub GameHub

    - name: Move Game Files to Cordova www folder
      run: |
        rm -rf mygame/www/*
        cp index.html style.css script.js mygame/www/
        if [ -f config.xml ]; then cp config.xml mygame/; fi

    - name: Add Android Platform and Build
      working-directory: ./mygame
      run: |
        cordova platform add android
        cordova build android

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gamehub-apk
        path: mygame/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        
