<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 Player Games - Pro Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen" class="screen active">
        <div class="splash-box">
            <h1 class="logo-text"><span class="c1">2 PLAYER</span> <span class="c2">GAMES</span></h1>
            <div class="badge-sub">PRO ARCADE</div>
            <div class="load-track"><div id="load-progress"></div></div>
            <p id="load-text">50%</p>
        </div>
    </div>

    <!-- Main Dashboard Hub -->
    <div id="hub-screen" class="screen">
        <header class="app-header">
            <div class="btn-icon" onclick="alert('Settings: Sound & Vibration ON')">⚙️</div>
            <div class="remove-ads">⭐ Pro Version</div>
            <div class="btn-icon">🇧🇩</div>
        </header>

        <div class="games-container">
            <h3 class="section-heading">Select Playable Game</h3>
            <div class="grid-4">
                <div class="game-item" onclick="startGame('Tic Tac Toe')">
                    <div class="ico bg-tictac">❌⭕</div>
                    <span>Tic Tac Toe</span>
                    <span class="tag hot">PLAY</span>
                </div>
                <div class="game-item" onclick="startGame('Reflex Race')">
                    <div class="ico bg-reflex">🏁</div>
                    <span>Reflex Race</span>
                    <span class="tag new">DUEL</span>
                </div>
                <div class="game-item" onclick="startGame('Cup Pong')">
                    <div class="ico bg-pong">🏓</div>
                    <span>Cup Pong</span>
                    <span class="tag hot">POPULAR</span>
                </div>
                <div class="game-item" onclick="startGame('Snake Retro')">
                    <div class="ico bg-snake">🐍</div>
                    <span>Snake Retro</span>
                    <span class="tag new">CLASSIC</span>
                </div>
            </div>
        </div>

        <footer class="bottom-footer">
            <div class="score-circle red">0</div>
            <button class="tour-btn" onclick="alert('Tournament Mode Active!')">🏆 PLAY TOURNAMENT</button>
            <div class="score-circle blue">0</div>
        </footer>
    </div>

    <!-- Gameplay Screen -->
    <div id="play-screen" class="screen">
        <div class="play-header">
            <button class="back-btn" onclick="goHome()">⬅ Menu</button>
            <h2 id="game-title-header">Game Arena</h2>
            <div style="width:40px;"></div>
        </div>
        <div id="game-board-area">
            <!-- Dynamic Game Renders Here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
